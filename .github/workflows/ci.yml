name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure browser dependency downloads
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-downloads >/dev/null
      - run: npx playwright install --with-deps chromium-headless-shell
        timeout-minutes: 10
      - run: npm run cf:types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:d1:wave2
      - run: npm run test:d1:wave3
      - run: npm run test:d1:wave4
      - run: npm run test:recovery
      - run: npm run test:workers
      - run: npm run build
      - run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high
